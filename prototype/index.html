<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Studio · 全媒体工作台产品原型</title><style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#e6edf7;background:#080e1b}*{box-sizing:border-box}body{margin:0}aside{position:fixed;inset:0 auto 0 0;width:218px;background:#101a2b;border-right:1px solid #29354a;padding:24px 14px}h1{font-size:21px;margin:0 0 6px;color:#6de4d9}small,.muted{color:#9aabc4}nav{margin-top:30px;display:grid;gap:6px}button,input,textarea,select{font:inherit}nav button{background:transparent;border:0;color:#b6c6de;padding:12px;border-radius:10px;text-align:left;cursor:pointer}nav button.active,nav button:hover{background:#1d3850;color:#64f5e7}main{margin-left:218px;padding:26px 30px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}header h2{margin:0}header span{font-size:12px;color:#f9c879;border:1px solid #715b34;border-radius:15px;padding:6px 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}.card{background:#121e30;border:1px solid #283c55;border-radius:14px;padding:20px;min-width:0}.card h3{margin-top:0}.wide{grid-column:span 2}.full{grid-column:1/-1}.kpi{font-size:32px;font-weight:700;color:#72e4db}p{color:#afc0d7;line-height:1.7}input,textarea,select{background:#0a1423;border:1px solid #37506d;border-radius:9px;padding:11px;color:#eef7ff;width:100%}textarea{min-height:240px;resize:vertical}.button{background:#1b7f89;border:0;border-radius:9px;padding:11px 16px;color:white;cursor:pointer}.button.secondary{background:#273a54}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tag{display:inline-block;border-radius:16px;padding:5px 10px;background:#243950;color:#acdbdf;font-size:12px;margin:3px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #304054;padding:13px;font-size:13px}th{color:#9cb2ce}.preview{background:#f8fafb;color:#202635;padding:20px;border-radius:13px;min-height:310px}.preview h2{color:#174c5c}.preview p{color:#3c4758}.cover{background:linear-gradient(130deg,#132338,#19636a);padding:22px;color:#a3fff2;border-radius:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tile{cursor:pointer}.tile:hover{border-color:#43c2bb}.hidden{display:none}.notice{background:#382c1d;border:1px solid #756142;padding:12px;border-radius:9px;color:#f2d5a2}ul{color:#aebdd2;line-height:2}@media(max-width:950px){aside{position:static;width:auto}nav{grid-template-columns:repeat(3,1fr);margin-top:14px}main{margin:0;padding:18px}.grid,.split{grid-template-columns:1fr}.wide{grid-column:span 1}}@media(max-width:500px){nav{grid-template-columns:repeat(2,1fr)}header{display:block}}
</style></head><body><aside><h1>◈ MEDIA STUDIO</h1><small>全媒体创作 · 同构原型 v0.1</small><nav id="nav"></nav><p style="margin-top:35px;font-size:12px">Java / Rust 双实现<br>同一产品规范和验收编号</p></aside><main><header><h2 id="heading">工作台</h2><span>交互原型 · 非真实发布系统</span></header><div id="view"></div></main><script>
const pages=['工作台','创作编辑器','模板中心','素材库','账号矩阵','发布中心','内容日历','审核中心','数据分析','AI 助手','系统设置'];let page='工作台';let selectedTemplate='深蓝科技公众号';let content={title:'A股无情，Tibo有情',body:'亏的钱补不回来，GPT 额度给你补满！\n\n这是一份测试内容，正式发布前请核对原始信息。'};let channels=['微信公众号','小红书','微博','知乎'];let selected=['微信公众号','小红书'];const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const card=(title,body,cl='')=>'<section class="card '+cl+'"><h3>'+title+'</h3>'+body+'</section>';function show(p){page=p;document.getElementById('heading').textContent=p;document.getElementById('nav').innerHTML=pages.map(x=>'<button class="'+(x===p?'active':'')+'" data-go="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));render()}function render(){let v='';if(page==='工作台')v='<div class="grid">'+card('草稿内容','<div class="kpi">1</div><p>待补充封面和图片授权</p>')+card('演示账号','<div class="kpi">0</div><p>尚未连接任何真实平台账号</p>')+card('已发布','<div class="kpi">0</div><p>没有可验证的真实发布回执</p>')+card('创作流程','<p>模板 → 内容 → 平台变体 → 预检 → 审核 → 分发 → 回执 → 复盘</p><button class="button" data-open="创作编辑器">开始创作</button>','wide')+card('注意','<p class="notice">演示交互不会发送至任何第三方平台。小红书等无开放发布权限时必须使用辅助交付。</p>')+'</div>';if(page==='创作编辑器')v='<div class="grid">'+card('编辑正文','<label>标题</label><input id="title" value="'+esc(content.title)+'"><p>正文</p><textarea id="body">'+esc(content.body)+'</textarea><div class="toolbar"><button class="button" id="save">保存草稿</button><button class="button secondary" data-open="发布中心">预检与发布</button></div><p id="save-note" class="muted">当前仅保存在本页面内存中</p>','wide')+card('多端预览','<div class="toolbar"><select id="platform-preview">'+channels.map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="preview"><h2 id="pt">'+esc(content.title)+'</h2><p id="pb">'+esc(content.body).replace(/\n/g,'<br>')+'</p></div>')+'</div>';if(page==='模板中心')v='<div class="grid">'+['深蓝科技公众号','公众号极简白','小红书种草九宫格','知识长图','新闻快讯','短视频分镜'].map((x,i)=>card(esc(x),'<div class="cover" style="min-height:120px"><strong>'+esc(x)+'</strong><p style="color:#d4ffff">封面 / 标题 / 正文 / 图片区域</p></div><div class="toolbar"><button class="button" data-template="'+esc(x)+'">使用模板</button></div>')).join('')+'</div>';if(page==='素材库')v='<div class="grid">'+card('素材上传','<p>选择本地图片，展示本地预览。原型不上传服务器。</p><input type="file" id="asset" accept="image/*"><div id="asset-display"></div>','wide')+card('图片规范','<p>版权归属、尺寸、平台安全区、Alt 文本、Logo/水印、去重、压缩以及 EXIF 隐私提示。</p>')+'</div>';if(page==='账号矩阵')v='<div class="grid">'+card('账号授权','<p class="notice">没有已授权账号</p><p>计划支持官方 OAuth、凭据加密、scope 核验、过期提示、多账号分组。</p>','wide')+card('平台能力','<p>DIRECT_API<br>AUTHORIZED_PARTNER<br>HANDOFF<br>UNSUPPORTED</p>')+'</div>';if(page==='发布中心')v='<div class="grid">'+card('目标平台','<p>选择目标渠道，原型将逐个平台预检，不会向平台发送请求。</p>'+channels.map(x=>'<label style="display:block;margin:12px 0"><input class="target" type="checkbox" value="'+x+'" '+(selected.includes(x)?'checked':'')+' style="width:auto"> '+x+'</label>').join('')+'<button class="button" id="preflight">执行模拟预检</button>','wide')+card('当前内容','<p>'+esc(content.title)+'</p><p>模板：'+esc(selectedTemplate)+'</p><span class="tag">无真实账号授权</span>')+card('分发状态矩阵','<div id="checks"><p>选择平台并点击预检</p></div>','full')+'</div>';if(page==='内容日历')v='<div class="grid">'+card('10 月内容计划','<p>按日期排期、拖动、审核门禁、时区与多平台变体。</p><input type="date"><button class="button secondary" style="margin-top:12px" onclick="alert(\'排期写入需后端实现，本原型不保存\')">查看排期校验</button>','wide')+'</div>';if(page==='审核中心')v='<div class="grid">'+card('审核流程','<p>撰稿 → 排版 → 合规校验 → 审核 → 定时/立即发布</p><span class="tag">四眼复核</span><span class="tag">RBAC</span><span class="tag">审计日志</span>','wide')+'</div>';if(page==='数据分析')v='<div class="grid">'+card('真实曝光','<div class="kpi">—</div><p>未接入官方指标，不展示虚假数据</p>')+card('真实互动','<div class="kpi">—</div>')+card('发布成功','<div class="kpi">0</div>')+'</div>';if(page==='AI 助手')v='<div class="grid">'+card('AI 写作工具','<p>标题生成、平台改写、配图提示词、SEO、来源核查与人工审批。</p><label>创作指令</label><textarea placeholder="输入需求；连接模型服务后才能执行"></textarea><p class="notice">未连接模型服务，无法真实生成。</p>','wide')+'</div>';if(page==='系统设置')v='<div class="grid">'+card('环境切换','<p>JAVA_API / RUST_API / DEMO：原型固定 DEMO。</p><p>真实版本必须连接统一 /api/v1 接口。</p>','wide')+card('安全','<p>OAuth、RBAC、加密存储、审计、速率限制、数据备份。</p>')+'</div>';document.getElementById('view').innerHTML=v;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{selectedTemplate=b.dataset.template;show('创作编辑器')});let t=document.getElementById('title'),b=document.getElementById('body');if(t)t.oninput=()=>{content.title=t.value;document.getElementById('pt').textContent=t.value};if(b)b.oninput=()=>{content.body=b.value;document.getElementById('pb').textContent=b.value};let save=document.getElementById('save');if(save)save.onclick=()=>document.getElementById('save-note').textContent='已保存到当前页面内存（刷新会丢失），非服务端持久化';let f=document.getElementById('asset');if(f)f.onchange=()=>{let file=f.files[0];if(file){let url=URL.createObjectURL(file);document.getElementById('asset-display').innerHTML='<p>本地预览：'+esc(file.name)+'</p><img alt="本地素材预览" style="max-width:100%;max-height:260px" src="'+url+'">'}};let pre=document.getElementById('preflight');if(pre)pre.onclick=()=>{selected=Array.from(document.querySelectorAll('.target:checked')).map(x=>x.value);document.getElementById('checks').innerHTML='<table><tr><th>平台</th><th>模式</th><th>预检</th><th>发布状态</th></tr>'+selected.map(x=>'<tr><td>'+esc(x)+'</td><td>'+(x==='小红书'?'HANDOFF':'需核实官方权限')+'</td><td>缺少账号授权和媒资</td><td>BLOCKED_AUTH · 未发布</td></tr>').join('')+'</table>';};}show('工作台');
</script></body></html>
